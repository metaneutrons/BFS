name: Dependency Action Qualification

on:
  push:
    branches: [test/dependabot-release-actions]

permissions:
  contents: read

jobs:
  produce:
    name: Sign and attest isolated fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.8.17
      - name: Exercise locked validator setup
        run: |
          set -euo pipefail
          [[ $(uv --version) == 'uv 0.8.17'* ]]
          uv venv "$RUNNER_TEMP/spdx-validation"
          uv pip sync --python "$RUNNER_TEMP/spdx-validation/bin/python" \
            --require-hashes tools/release/requirements.txt
          "$RUNNER_TEMP/spdx-validation/bin/python" -c 'import spdx_tools'
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign fixture with the release command
        run: |
          set -euo pipefail
          mkdir fixture
          printf 'BFS dependency qualification %s %s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" \
            > fixture/payload.txt
          cosign version
          cosign sign-blob --yes --bundle fixture/payload.sigstore.json fixture/payload.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            fixture/payload.txt
            fixture/payload.sigstore.json
      - name: Verify positive and tampered fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          identity="https://github.com/$GITHUB_WORKFLOW_REF"
          signer="$GITHUB_REPOSITORY/.github/workflows/dependency-probe.yml"
          cosign verify-blob --bundle fixture/payload.sigstore.json \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "$identity" fixture/payload.txt
          for asset in fixture/payload.txt fixture/payload.sigstore.json; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$signer" --source-ref "$GITHUB_REF"
          done
          cp fixture/payload.txt "$RUNNER_TEMP/tampered.txt"
          printf 'tamper\n' >> "$RUNNER_TEMP/tampered.txt"
          set +e
          cosign verify-blob --offline --bundle fixture/payload.sigstore.json \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "$identity" "$RUNNER_TEMP/tampered.txt" \
            > "$RUNNER_TEMP/cosign-negative.log" 2>&1
          cosign_status=$?
          gh attestation verify "$RUNNER_TEMP/tampered.txt" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$signer" --source-ref "$GITHUB_REF" \
            > "$RUNNER_TEMP/attestation-negative.log" 2>&1
          attestation_status=$?
          set -e
          [[ "$cosign_status" -eq 1 && "$attestation_status" -eq 1 ]]
          grep -Eiq '(digest.*(match|mismatch)|invalid signature|signature verification failed)' \
            "$RUNNER_TEMP/cosign-negative.log"
          grep -Eq '(HTTP 404|404 Not Found)' "$RUNNER_TEMP/attestation-negative.log"
          (cd fixture && sha256sum payload.txt payload.sigstore.json > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: legacy-zip
          path: fixture/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upgraded-zip
          path: fixture/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: single-file-zip
          path: fixture/payload.txt
          if-no-files-found: error
          retention-days: 7

  upgraded-consumer:
    name: Download old and new artifacts with v8
    needs: produce
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: legacy-zip
          path: legacy
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: upgraded-zip
          path: upgraded
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: single-file-zip
          path: single
      - name: Verify inventory and byte identity
        run: |
          set -euo pipefail
          (cd legacy && sha256sum --check SHA256SUMS)
          (cd upgraded && sha256sum --check SHA256SUMS)
          diff -r legacy upgraded
          cmp legacy/payload.txt single/payload.txt
          [[ $(find legacy -type f | wc -l) -eq 3 ]]
          [[ $(find single -type f | wc -l) -eq 1 ]]

  legacy-consumer:
    name: Download v7 artifacts with existing v5
    needs: produce
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: upgraded-zip
          path: upgraded
      - name: Verify compatibility during sequential merges
        run: |
          set -euo pipefail
          (cd upgraded && sha256sum --check SHA256SUMS)
          [[ $(find upgraded -type f | wc -l) -eq 3 ]]
