name: BFS CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commit-hygiene:
    name: Commit Hygiene
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check pull request and commit attribution
        run: tools/check-commit-hygiene.sh

  quality:
    name: Repository Quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install pinned CI tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ripgrep shellcheck file
          tools/install-ci-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Validate repository and quality gates
        run: |
          set -euo pipefail
          make repository-audit
          make quality-gates
          make shellcheck
          make actionlint
          make secrets-scan

  host-tests:
    name: Host Tests (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and run host tests
        env:
          HOST_CC: ${{ matrix.compiler }}
        run: make host-test HOST_CC="$HOST_CC"
      - name: Compile host tools
        env:
          HOST_CC: ${{ matrix.compiler }}
        run: make tools build/host/mkbfs HOST_CC="$HOST_CC"

  sanitizers:
    name: Address and Undefined Behavior Sanitizers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run sanitizer suite
        run: make sanitize HOST_CC=clang

  static-analysis:
    name: Clang Static Analyzer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Analyze core and host block device
        run: make analyze

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: 0.8.17
      - name: Enforce line coverage floor
        run: make coverage HOST_CC=gcc GCOVR='uvx --from gcovr==8.3 gcovr'
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: build/coverage.xml
          if-no-files-found: error

  integration-test:
    name: Amiga Integration Test
    runs-on: ubuntu-24.04
    needs: host-tests
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install emulator and pinned cross-compiler
        id: toolchain
        env:
          AMIGA_GCC_IMAGE: amigadev/m68k-amigaos-gcc@sha256:b18080e6ffca8f793e0f539536a9138e9d2a548ca1a301c7483f43ee15fedfed
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fs-uae xvfb libarchive-tools musl
          tools/install-lha.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

          docker pull "$AMIGA_GCC_IMAGE"
          container=$(docker create "$AMIGA_GCC_IMAGE")
          trap 'docker rm -f "$container" >/dev/null 2>&1' EXIT
          docker cp "$container:/opt/amiga" "$RUNNER_TEMP/amiga"
          echo "$RUNNER_TEMP/amiga/bin" >> "$GITHUB_PATH"
          echo "prefix=$RUNNER_TEMP/amiga/m68k-amigaos" >> "$GITHUB_OUTPUT"

      - name: Build and run the Amiga integration suite
        run: |
          set -euo pipefail
          make release AMIGA_PREFIX="${{ steps.toolchain.outputs.prefix }}"
          tools/release/qualify-archives.sh "v$(cat version.txt)-ci.$GITHUB_RUN_ID" \
            "$(git show -s --format=%ct HEAD)" build/ci-archives
          make ci-test AMIGA_PREFIX="${{ steps.toolchain.outputs.prefix }}"

      - name: Preserve emulator evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: amiga-integration-evidence
          path: build/emulator/run.*
          if-no-files-found: error

  ci-success:
    name: CI Success
    if: always()
    needs:
      [commit-hygiene, quality, host-tests, sanitizers, static-analysis, coverage, integration-test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require every preceding job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          tools/check-ci-results.sh
