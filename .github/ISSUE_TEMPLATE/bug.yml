name: Bug report
description: Report a reproducible defect in BFS
title: "fix: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here. Use private vulnerability reporting.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Explain what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reliable sequence of steps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: BFS version or commit
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - AmigaOS
        - AROS
        - Host test environment
        - Other
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs and diagnostics
      render: shell
