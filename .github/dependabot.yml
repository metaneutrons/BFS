version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:15'
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
